<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Galaxia - Luna</title>

    <style>
        body,
        html {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 2px solid #7cc7ff;
            border-radius: 999px;
            background: rgba(0, 0, 0, .25);
            box-shadow: 0 0 15px #7cc7ff, 0 0 30px #4b8cff;
            z-index: 1000;
            font-family: Arial, sans-serif;
            color: #fff;
            font-size: 14px;
        }

        .player button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            filter: drop-shadow(0 0 6px #7cc7ff);
            transition: transform .2s;
        }

        .player button:hover {
            transform: scale(1.2);
        }

        .progress {
            flex-grow: 1;
            height: 14px;
            background: rgba(255, 255, 255, .12);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(270deg, #7cc7ff, #cbb8ff, #ffffff, #7cc7ff);
            background-size: 400% 400%;
            border-radius: 999px;
            box-shadow: 0 0 10px #7cc7ff;
            animation: flowing 6s ease infinite;
        }

        @keyframes flowing {
            0% {
                background-position: 0 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0 50%
            }
        }

        .time {
            min-width: 74px;
            text-align: right;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 0 5px #7cc7ff;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div class="player">
        <button id="play">▶️</button>
        <div class="progress" id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time" id="time">0:00 / 0:00</div>
    </div>

    <audio id="audio" loop>
        <source
            src="https://www.dropbox.com/scl/fi/fkaq8sh3rzxhc5ddab3ba/Joey-Montana_-LA-MELOD-A-LETRA.mp3?rlkey=4o9od5tvxv5cf4bbrokperl40&st=ywujm5dh&raw=1"
            type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>

    <script>
        const audio = document.getElementById("audio");
        const playBtn = document.getElementById("play");
        const progress = document.getElementById("progress");
        const progressBar = document.getElementById("progress-bar");
        const timeDisplay = document.getElementById("time");

        let isPlaying = false;

        function formatTime(e) {
            if (!isFinite(e)) return "0:00";
            return Math.floor(e / 60) + ":" + Math.floor(e % 60).toString().padStart(2, "0");
        }

        playBtn.addEventListener("click", async () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = "▶️";
            } else {
                await audio.play();
                playBtn.textContent = "⏸️";
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener("timeupdate", () => {
            const e = audio.currentTime / audio.duration * 100;
            progressBar.style.width = (isFinite(e) ? e : 0) + "%";
            timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        });

        progress.addEventListener("click", e => {
            const t = progress.getBoundingClientRect();
            const n = (e.clientX - t.left) / t.width;
            if (isFinite(audio.duration)) {
                audio.currentTime = n * audio.duration;
            }
        });
        const canvas = document.getElementById("c");

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(innerWidth, innerHeight);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            60,
            innerWidth / innerHeight,
            .1,
            5000
        );

        let targetDist = 300;
        let currentDist = 300;
        let rotX = .2;
        let rotY = 0;

        const loader = new THREE.TextureLoader();

        /* Fondo espacial */
        const nebulaTex = loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/cube/space/px.jpg");
        scene.background = nebulaTex;

        /* Estrellas */
        function createStars(count = 2500, radius = 3000) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const distance = radius * (.3 + .7 * Math.random());
                const angle = Math.random() * Math.PI * 2;
                const elevation = Math.acos(2 * Math.random() - 1);

                positions[i * 3 + 0] = distance * Math.sin(elevation) * Math.cos(angle);
                positions[i * 3 + 1] = distance * Math.cos(elevation);
                positions[i * 3 + 2] = distance * Math.sin(elevation) * Math.sin(angle);
            }

            geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

            const stars = new THREE.Points(
                geometry,
                new THREE.PointsMaterial({
                    size: 1.6,
                    color: 0xffffff,
                    depthWrite: false
                })
            );

            scene.add(stars);
        }

        createStars();

        /* Luces */
        const ambientLight = new THREE.AmbientLight(0xffffff, .35);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0xffffff, 1.7);
        moonLight.position.set(150, 120, 200);
        scene.add(moonLight);

        const softBlueLight = new THREE.PointLight(0x7cc7ff, 1.2, 800);
        softBlueLight.position.set(-120, 80, 160);
        scene.add(softBlueLight);

        /* Luna realista */
        const moonTexture = loader.load("https://threejs.org/examples/textures/planets/moon_1024.jpg");

        const coreMat = new THREE.MeshPhongMaterial({
            map: moonTexture,
            color: 0xffffff,
            shininess: 4
        });

        const core = new THREE.Mesh(
            new THREE.SphereGeometry(45, 96, 96),
            coreMat
        );

        scene.add(core);

        /* Halo de la Luna */
        function makeMoonGlow(size = 768) {
            const canvas = document.createElement("canvas");
            canvas.width = canvas.height = size;

            const ctx = canvas.getContext("2d");
            const gradient = ctx.createRadialGradient(
                size / 2, size / 2, .08 * size,
                size / 2, size / 2, .5 * size
            );

            gradient.addColorStop(0, "rgba(255,255,255,.75)");
            gradient.addColorStop(.35, "rgba(124,199,255,.35)");
            gradient.addColorStop(.7, "rgba(120,150,255,.15)");
            gradient.addColorStop(1, "rgba(0,0,0,0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            return new THREE.CanvasTexture(canvas);
        }

        const glow = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: makeMoonGlow(),
                transparent: true,
                depthWrite: false
            })
        );

        glow.scale.set(300, 300, 1);
        scene.add(glow);

        /* Texto central opcional */
        function makeCenterTextTexture(text) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 70px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#7cc7ff";
            ctx.shadowBlur = 35;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        /* Si quieres texto encima de la luna, deja esto.
           Si no quieres texto, comenta estas 4 líneas. */
        const centerTex = makeCenterTextTexture("TE AMO ❤️");
        const centerMat = new THREE.SpriteMaterial({ map: centerTex, transparent: true });
        const centerSprite = new THREE.Sprite(centerMat);
        centerSprite.scale.set(60, 60, 1);
        centerSprite.position.set(0, 0, 0);
        centerSprite.renderOrder = 999;
        /* scene.add(centerSprite); */

        /* Dedicatorias flotantes */
        const WORDS = [];
        const baseWords = [
            "💖 Mi amor", "🌙 Mi luna", "✨ Brillas", "❤️ Te amo",
            "🌌 Mi universo", "👑 Mi reina", "🌠 Mi estrella",
            "💫 Mi cielo", "🔥 Siempre tú", "🎶 Tu risa",
            "💎 Eres todo", "🙏 Gracias", "💕 Cariño",
            "🌹 Amor eterno", "🤗 Abrazos", "🌸 Esperanza",
            "🌈 Alegría", "🌟 Contigo", "🧸 Ternura",
            "🎁 Mi razón", "🌙 Mi destino", "💌 Recuerdos",
            "🕊️ Mi paz", "🌊 Mi calma", "💡 Mi luz",
            "🥰 Mi vida", "🎇 Felicidad", "🌺 Mi flor",
            "💜 Eternidad", "🌟 Sueños", "✨ Magia",
            "⭐ Mi estrella", "🌄 Amanecer", "🌃 Noche contigo",
            "💫 Inspiración", "🌷 Siempre juntos", "🎀 Mi ternura",
            "🍀 Mi fortuna", "🪞 Mi reflejo"
        ];

        for (let i = 0; i < 6; i++) {
            WORDS.push(...baseWords);
        }

        function makeTextTexture(text, color) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 128;

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 58px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#fff";
            ctx.shadowColor = color;
            ctx.shadowBlur = 30;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        const COLORS = [
            "#ff66ff", "#66ccff", "#ffd36b", "#ff9966",
            "#8df59a", "#ffa0f8", "#c6a7ff", "#ff4444",
            "#44ff99", "#99ccff", "#ffffff"
        ];

        const textGroup = new THREE.Group();
        scene.add(textGroup);

        for (let i = 0; i < WORDS.length; i++) {
            const texture = makeTextTexture(WORDS[i], COLORS[i % COLORS.length]);

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(50, 16, 1);

            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            const radius = 150 + 130 * Math.random();

            sprite.position.set(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );

            sprite.userData = {
                phi: phi,
                theta: theta,
                radius: radius,
                speed: .001 + .0015 * Math.random(),
                floatOffset: Math.random() * Math.PI * 2
            };

            textGroup.add(sprite);
        }
        let dragging = false;
        let lastX = 0;
        let lastY = 0;

        function onDown(e) {
            dragging = true;
            const p = e.touches ? e.touches[0] : e;
            lastX = p.clientX;
            lastY = p.clientY;
        }

        function onMove(e) {
            if (!dragging) return;

            const p = e.touches ? e.touches[0] : e;
            const dx = (p.clientX - lastX) / innerWidth;
            const dy = (p.clientY - lastY) / innerHeight;

            rotY -= 3 * dx;
            rotX = Math.max(-1.2, Math.min(1.2, rotX - 2.2 * dy));

            lastX = p.clientX;
            lastY = p.clientY;
        }

        function onUp() {
            dragging = false;
        }

        addEventListener("mousedown", onDown);
        addEventListener("mousemove", onMove);
        addEventListener("mouseup", onUp);

        addEventListener("touchstart", onDown, { passive: true });
        addEventListener("touchmove", onMove, { passive: true });
        addEventListener("touchend", onUp, { passive: true });

        addEventListener("wheel", e => {
            targetDist += .25 * e.deltaY;
            targetDist = Math.max(160, Math.min(650, targetDist));
        }, { passive: true });

        let pinch = 0;

        addEventListener("touchmove", e => {
            if (e.touches && e.touches.length === 2) {
                e.preventDefault();

                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.hypot(dx, dy);

                if (pinch) {
                    targetDist += .5 * (pinch - distance);
                    targetDist = Math.max(160, Math.min(650, targetDist));
                }

                pinch = distance;
            }
        }, { passive: false });

        addEventListener("touchend", () => {
            pinch = 0;
        }, { passive: true });

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        let t = 0;

        function tick() {
            requestAnimationFrame(tick);
            t += .01;

            /* Rotación automática de la Luna */
            core.rotation.y += .0025;
            core.rotation.x += .0004;

            /* Halo respirando */
            const glowScale = 300 * (1 + .04 * Math.sin(t * 1.5));
            glow.scale.set(glowScale, glowScale, 1);

            /* Dedicatorias orbitando y flotando */
            textGroup.children.forEach(sprite => {
                sprite.userData.theta += sprite.userData.speed;

                const floatY = Math.sin(t * 2 + sprite.userData.floatOffset) * 8;
                const radius = sprite.userData.radius;

                sprite.position.x = radius * Math.sin(sprite.userData.phi) * Math.cos(sprite.userData.theta);
                sprite.position.y = radius * Math.cos(sprite.userData.phi) + floatY;
                sprite.position.z = radius * Math.sin(sprite.userData.phi) * Math.sin(sprite.userData.theta);

                sprite.material.opacity = .75 + .25 * Math.sin(t * 2 + sprite.userData.floatOffset);
            });

            /* Zoom suave */
            currentDist += .06 * (targetDist - currentDist);

            const cx = Math.cos(rotX);
            const sx = Math.sin(rotX);
            const cy = Math.cos(rotY);
            const sy = Math.sin(rotY);

            camera.position.set(
                currentDist * sy * cx,
                currentDist * sx,
                currentDist * cy * cx
            );

            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        tick();
    </script>
</body>

</html>
